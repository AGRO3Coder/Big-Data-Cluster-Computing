{% extends 'layouts/base.html' %}

{% block content %}
<div class="container mx-auto p-4">
    <h1 class="text-2xl font-semibold mb-8">HDFS文件类型统计</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-4">
        
        <div class="bg-white rounded-lg shadow p-6">
            <h3 class="text-lg font-semibold mb-4">文件类型对比（条形图）</h3>
            <canvas id="barChart"></canvas>
        </div>

        <div class="bg-white rounded-lg shadow p-6">
            <h3 class="text-lg font-semibold mb-4">文件数量趋势（折线图）</h3>
            <canvas id="lineChart"></canvas>
        </div>

        <div class="bg-white rounded-lg shadow p-6">
            <h3 class="text-lg font-semibold mb-4">文件大小分布（点状图）</h3>
            <canvas id="scatterChart"></canvas>
        </div>

        <div class="bg-white rounded-lg shadow p-6">
            <h3 class="text-lg font-semibold mb-4">文件类型分布（饼图）</h3>
            <canvas id="pieChart"></canvas>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const fileTypes = {{ file_types_json|safe }};
        console.log('接收到的文件类型数据:', fileTypes); // 添加日志输出

        // 饼图
        new Chart(document.getElementById('pieChart'), {
            type: 'pie',
            data: {
                labels: Object.keys(fileTypes),
                datasets: [{ data: Object.values(fileTypes), backgroundColor: ['#4299e1', '#48bb78', '#f6e05e', '#ed8936', '#e53e3e'] }]
            }
        });

        // 折线图（按天统计）
        try {
            const dailyData = JSON.parse('{{ daily_data_json|escapejs }}');
            const timeLabels = dailyData.dates;
            const lineData = dailyData.counts;

            new Chart(document.getElementById('lineChart'), {
                type: 'line',
                data: {
                    labels: timeLabels,
                    datasets: [{ 
                        label: '每日文件数量', 
                        data: lineData,
                        borderColor: 'rgb(75, 192, 192)',
                        tension: 0.1
                    }]
                },
                options: {
                    scales: {
                        x: { title: { display: true, text: '日期' } },
                        y: { title: { display: true, text: '文件数量' }, beginAtZero: true }
                    }
                }
            });
        } catch (e) {
            console.error('解析每日文件数据失败:', e);
            alert('加载文件数量趋势数据失败，请刷新页面或检查HDFS连接');
        }

        // 点状图（模拟文件大小）
        const scatterData = Object.entries(fileTypes).map(([type, count]) => ({ x: type, y: count * 100 }));
        new Chart(document.getElementById('scatterChart'), {
            type: 'scatter',
            data: {
                datasets: [{ data: scatterData, backgroundColor: '#48bb78' }]
            },
            options: {
                scales: {
                    x: {
                        type: 'category',
                        title: { display: true, text: '文件类型' }
                    },
                    y: {
                        beginAtZero: true,
                        title: { display: true, text: '文件大小(KB)' }
                    }
                }
            }
        });

        // 条形图
        new Chart(document.getElementById('barChart'), {
            type: 'bar',
            data: {
                labels: Object.keys(fileTypes),
                datasets: [{ data: Object.values(fileTypes), backgroundColor: ['#4299e1', '#48bb78', '#f6e05e', '#ed8936', '#e53e3e'] }]
            }
        });
    });
</script>
{% endblock %}
