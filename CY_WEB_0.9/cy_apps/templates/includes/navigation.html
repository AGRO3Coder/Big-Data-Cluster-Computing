<style>
    /* 1. 基础样式 */
    button.icon-btn {
        padding: 4px;
        background: transparent;
        border: none;
        border-radius: 4px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background-color .2s;
    }

    /* 2. hover 效果 — 更高优先级 + !important */
    button.icon-btn:not(.no-hover):hover {
        background-color: rgba(0, 0, 0, 0.05) !important;
    }

    /* 3. 取消 focus / active 高亮 */
    button.icon-btn:focus,
    button.icon-btn:focus-visible,
    button.icon-btn:active {
        outline: none !important;
        box-shadow: none !important;
        background-color: transparent !important;
    }

    /* 4. 点击后锁定无 hover */
    button.icon-btn.no-hover {
        background-color: transparent !important;
        cursor: default;
    }

    /* 5. 图标大小 */
    button.icon-btn img {
        display: block;
        width: 24px;
        height: 24px;
        object-fit: contain;
    }

    /* 容器水平居中对齐，项目间距 1rem */
    .nav-container {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.5rem;
    }

    /* 搜索框 wrapper，方便定位图标 */
    .search-wrapper {
        position: relative;
    }

    /* 输入框基础样式 */
    .search-input {
        padding: 0.5rem 1rem 0.5rem 2.5rem;
        border: 1px solid #d1d5db; /* gray-300 */
        border-radius: 9999px; /* pill 形状 */
        background-color: #f3f4f6; /* gray-100 */
        font-size: 0.875rem; /* text-sm */
        outline: none;
        transition: box-shadow .2s;
        width: 12rem; /* 192px, 类似 w-48 */
    }

    /* 响应式：屏幕宽度 ≥1024px 时加宽到 16rem */
    @media (min-width: 1024px) {
        .search-input {
            width: 16rem;
        }

        /* 类似 lg:w-64 */
    }

    /* 输入框聚焦时的阴影效果 */
    .search-input:focus {
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3); /* blue-500/30 */
    }

    /* 搜索图标 */
    .icon-search {
        position: absolute;
        left: 0.75rem;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1rem; /* 16px */
        color: #9ca3af; /* gray-400 */
        pointer-events: none;
    }

    /* 图标按钮（铃铛等） */
    .icon-button {
        padding: 0.5rem;
        border: none;
        background: transparent;
        border-radius: 9999px;
        cursor: pointer;
        transition: background-color .2s;
    }


    .icon-button i {
        font-size: 1rem;
        color: #4b5563; /* gray-600 */
    }

    /* 用户区域 */
    .user-menu {
        position: relative;
    }

    .user-menu button {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.25rem;
        border: none;
        background: transparent;
        cursor: pointer;
    }

    /* 头像 */
    .user-menu .avatar {
        width: 2rem; /* 32px */
        height: 2rem;
        border-radius: 9999px;
        object-fit: cover;
    }

    /* 用户名初始隐藏，小屏不显示 */
    .user-menu .username {
        display: none;
        font-size: 0.875rem;
        font-weight: 500;
        color: #111827; /* gray-900 */
    }

    /* 屏幕宽度 ≥768px 时显示用户名 */
    @media (min-width: 768px) {
        .user-menu .username {
            display: inline;
        }
    }

    /* 下拉箭头 */
    .user-menu .icon-down {
        font-size: 0.75rem; /* 12px */
        color: #6b7280; /* gray-500 */
    }

    .icon-bell-xl {
        font-size: 3rem;
    }
</style>
